<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - {{ gateway_name }}</title>
    <link rel="stylesheet" href="/static/css/admin_login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>管理员登录</h1>
            <p>请输入管理员账号信息</p>
        </div>
        
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            
            <div class="form-group">
                <label for="captcha_code">图形验证码</label>
                <div class="captcha-wrapper">
                    <input type="text" id="captcha_code" name="captcha_code" placeholder="请输入图形验证码" maxlength="4" required>
                    <img src="/admin/captcha" id="captcha-img" class="captcha-img" onclick="refreshCaptcha()" alt="验证码">
                </div>
            </div>
            
            <button type="submit" class="btn-login">登录</button>
        </form>
        
        <div class="back-link">
            <a href="/">返回普通用户登录</a>
        </div>
        
        <div class="info-box">
            <h3>管理员登录说明</h3>
            <p>管理员登录需要验证用户名、密码和图形验证码。普通用户请使用首页登录。</p>
        </div>
    </div>
    
    <script src="/static/js/admin_login.js"></script>
</body>
</html>
